[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtaas"
version = "0.1.0"
description = "Red-Team-as-a-Service: automated adversarial testing for LLMs with compliance-ready reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "red-teaming", "ai-safety", "hallucination", "eu-ai-act", "compliance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
entropy = [
    "torch>=2.2",
    "transformers>=4.40",
]
pdf = [
    "weasyprint>=62",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
rtaas = "rtaas.cli:app"

[project.urls]
Homepage = "https://github.com/A-Kuo/rtaas"
Repository = "https://github.com/A-Kuo/rtaas"
Issues = "https://github.com/A-Kuo/rtaas/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
